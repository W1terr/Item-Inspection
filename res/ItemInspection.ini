; All of this can also be changed in game: SKSE Menu Framework > Item Inspection > Settings
[General]
; 1 = picked up items go to your hand first, 0 = normal pickup
bEnabled=1
; 0 = you look at each kind of item only the first time you take it (per playthrough), 1 = every time
bAlwaysInspect=0
; scrolling up on an item in the inventory closes it and puts the item in your hand
bInventoryInspect=1
; stolen items go to your hand too (it only counts as stealing when you put the item in your backpack)
bInspectStolen=1
; the item floats over your hand with the Telekinesis hand effect, fingers move while you turn it
bTelekinesis=1
; telekinesis: size of the hand effect (1 = like the spell), the spell's hand light, the grab sound (pick up, put away, put back)
fTelekinesisSize=2.0
bTelekinesisLight=1
bTelekinesisSound=1
; normal pickup while you are in combat
bSkipInCombat=1
; normal pickup for gold coins
bSkipGold=1
; normal pickup for arrows and bolts
bSkipAmmo=1
; normal pickup for weapons (bows too) / for armor, clothes and jewelry
bSkipWeapons=0
bSkipArmor=0
; show "[E] Put in backpack  [R] Put back" on screen while you hold an item
bShowHint=1
; nobody talks to you, attacks you or can hurt you while you hold an item (people pause until you put it away)
bWorldWaits=1
; from 3rd person: a short fade to black hides the camera switch; seconds to black (back takes 1.5x)
bFadeTransition=1
fFadeTime=0.20
; menu and hint language: 0 = the game's language, 1 English, 2 French, 3 German, 4 Italian, 5 Spanish, 6 Polish,
; 7 Russian, 8 Japanese, 9 Chinese
iLanguage=0

[Controls]
; Keyboard: DirectInput scan code (18 = E, 19 = R, 16 = Q, 57 = Space). Mouse: 256 + button (256 left, 257 right, 258 middle).
iStoreKey=18
iPutBackKey=19
; Gamepad: 276 A, 277 B, 278 X, 279 Y, 274 LB, 275 RB
iStoreGamepadKey=276
iPutBackGamepadKey=277
; hold to turn your head (the hand and the item stay where they are), let go and it turns back. 257 = right mouse, 281 = RT
iLookKey=257
iLookGamepadKey=281
bInvertLookY=0
; how fast the mouse / right stick turns the item
fMouseSensitivity=1.0
fGamepadSensitivity=1.0
bInvertY=0

[Hold]
; where the hand holds the item, in game units from your eyes
fHoldRight=10.5
fHoldForward=31.4
fHoldUp=-12.1
; how far the item floats above your palm
fHoldHeight=9.1
; item position: moves the item from its place over the hand (right, away from you, up), game units
fItemRight=-1.3
fItemForward=5.7
fItemUp=1.0
; hand rotation in degrees: turn right (+) / left, tilt fingers up (+) / down, roll the palm around the fingers
fHandTurn=0
fHandTilt=8
fHandRoll=-17
; bigger items are shown smaller so they fit in the hand (radius in game units)
fMaxItemSize=20.0
; seconds: hand comes up / goes to the backpack / comes back
fRaiseTime=0.45
fStowTime=0.6
fReturnTime=0.5

[Weapons]
; weapons are held by the grip: where the hand is (game units from your eyes: right, forward, up)
fWeaponRight=17.6
fWeaponForward=31.4
fWeaponUp=-10.7
; blade angle in degrees: tipped left from straight up, tipped away from you, turned around the blade
fWeaponLeanLeft=5
fWeaponLeanForward=16
fWeaponRoll=12

[Bows]
; bows and crossbows are held further out (about arm's length) and more upright, so more of them is in view.
; Bows are held like an archer holds them, string towards you. Your arm reaches about 36 forward.
fBowRight=17.0
fBowForward=30.4
fBowUp=-10.3
fBowLeanLeft=18
fBowLeanForward=-7
